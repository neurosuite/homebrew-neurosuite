name: Tests

# Builds every formula from source and runs its test on macOS 15 (Apple silicon).
# Homebrew no longer provides bottles for macOS 14, so dependencies would be built there too.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  formulae:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-15
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      - name: Check style
        run: brew style neurosuite/neurosuite
      - name: Build and test
        run: |
          # The runner image has leftover links into openssl@1.1 (no longer a formula, so
          # brew unlink cannot remove them). They block linking openssl@3.
          find "$(brew --prefix)" -maxdepth 4 -lname '*openssl@1.1*' -print -delete
          for formula in libneurosuite neuroscope klusters ndmanager ndmanager-plugins; do
            brew install --overwrite --only-dependencies neurosuite/neurosuite/$formula
            brew install --build-from-source --verbose neurosuite/neurosuite/$formula
            brew test --verbose neurosuite/neurosuite/$formula
          done
